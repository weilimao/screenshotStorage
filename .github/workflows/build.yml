name: Build and Publish Electron App

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.1.7 的 tag 时触发自动打包发布

permissions:
  contents: write # 赋予 Action 往 Releases 写入二进制文件的权限

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest] # 分别在 Windows 和 macOS 镜像中编译

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript & Package (${{ matrix.os }})
        run: |
          npm run build
          npx electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.os }}
          path: |
            dist-package/*.exe
            dist-package/*.zip
            dist-package/*.dmg
            dist-package/*.blockmap
            dist-package/latest*.yml

  publish:
    name: Create GitHub Release and Publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: 'release-artifacts-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
