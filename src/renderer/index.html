<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>截图智能暂存箱</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-icon">📸</div>
        <h2>暂存箱 <span>Box</span></h2>
      </div>
      
      <!-- 滚动主体区 -->
      <div class="sidebar-body">
        <div class="control-group">
          <label class="section-title">屏幕小浮窗</label>
          <button id="btn-toggle-float" class="btn btn-primary">
            <span class="icon">✨</span>
            <span id="float-btn-text" class="text">开启悬浮窗</span>
          </button>
        </div>

        <div class="control-group">
          <label class="section-title">界面主题</label>
          <button id="btn-toggle-theme" class="btn btn-secondary">
            <span id="theme-icon" class="icon">☀️</span>
            <span id="theme-text" class="text">切换为浅色</span>
          </button>
        </div>

        <div class="control-group">
          <div class="toggle-container">
            <span class="toggle-label">🚀 开机自启</span>
            <label class="switch">
              <input type="checkbox" id="switch-autostart">
              <span class="slider round"></span>
            </label>
          </div>
        </div>

        <!-- 保留时长设置 -->
        <div class="control-group">
          <label class="section-title">⏱️ 自动清理保留时长</label>
          <select id="select-retention" class="select-field">
            <option value="3">3 天</option>
            <option value="7">7 天 (1周)</option>
            <option value="14">14 天 (2周)</option>
            <option value="30">30 天 (1个月)</option>
            <option value="0">永久保存</option>
          </select>
        </div>

        <div class="control-group">
          <label class="section-title">数据存放目录</label>
          <div class="storage-path-display" id="storage-path-text" title="正在获取...">正在获取...</div>
          <button id="btn-change-storage" class="btn btn-secondary btn-sm">
            <span>📁</span> 更改存放位置
          </button>
        </div>

        <div class="control-group">
          <label class="section-title">微信截图文件夹监听</label>
          <div class="folder-path-display" id="watch-folder-list">
            <div class="empty-folder-tip">暂无监听目录</div>
          </div>
          <button id="btn-add-folder" class="btn btn-secondary btn-sm">
            <span>➕</span> 添加监听文件夹
          </button>
        </div>
      </div>

      <div class="control-group footer" style="display: flex; flex-direction: column; gap: 8px;">
        <button id="btn-clear-images" class="btn btn-secondary btn-sm" style="color: var(--danger-color); border-color: rgba(255, 82, 82, 0.2);">
          <span>🖼️</span> 清空所有图片
        </button>
        <button id="btn-clear-videos" class="btn btn-secondary btn-sm" style="color: var(--danger-color); border-color: rgba(255, 82, 82, 0.2);">
          <span>🎥</span> 清空所有视频
        </button>
        <button id="btn-clear-all" class="btn btn-danger btn-sm">
          <span>🗑️</span> 一键全部清空
        </button>
        <div class="app-version">v1.0.0 · 智能中转器</div>
      </div>
    </aside>

    <!-- 主展示区域 -->
    <main class="main-content">
      <header class="content-header">
        <h1>我的截图暂存 <span>(拖拽图片到 CLI 终端即录入路径)</span></h1>
        <div class="status-badge">
          <span class="status-dot pulsing"></span>
          已开启剪贴板监听
        </div>
      </header>

      <!-- 新增：多分类选项卡 -->
      <div class="category-container">
        <div class="category-tabs" id="category-tabs">
          <button class="tab-btn active" data-type="all">全部 <span class="badge" id="count-all">0</span></button>
          <button class="tab-btn" data-type="image">图片 <span class="badge" id="count-image">0</span></button>
          <button class="tab-btn" data-type="video">视频 <span class="badge" id="count-video">0</span></button>
        </div>
      </div>
      
      <!-- 截图列表 -->
      <div class="image-grid-container">
        <div id="image-grid" class="image-grid">
          <!-- 动态加载图片卡片 -->
        </div>
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">📤</div>
          <h3>暂无截图数据</h3>
          <p>按下系统截图（如 `Win + Shift + S` 或微信截图）后，图片将自动落盘并同步至此。</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast">复制成功！</div>
  
  <!-- 图片大图预览模态框 -->
  <div id="preview-modal" class="preview-modal">
    <button class="preview-close-btn" id="preview-close-btn">×</button>
    <img id="preview-image" src="" alt="Preview">
  </div>
  
  <script>var exports = {};</script>
  <script src="../../dist/renderer/js/renderer.js"></script>
</body>
</html>
